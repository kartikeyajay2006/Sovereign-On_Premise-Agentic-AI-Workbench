<svg xmlns="http://www.w3.org/2000/svg" viewBox="1.25 1.25 21.5 21.5" width="32" height="32">
  <!--
    The AEGIS mark at tab size: the shield with the ledger cut through it,
    one evenodd path, as in components/aegis-logo.tsx.

    Two deliberate differences from the header mark, both for 16px. There
    is no tile behind it, so the shield fills the square instead of a third
    of it. And the slots are 2.4 units tall with 1.6 between, not 2 and 2:
    at 16px the header geometry blurs into a grey block, and these stay
    three bars. Compared at 16, 24 and 32px on light and dark tab strips
    before it was drawn.

    The colour follows the browser's theme, so the mark is ink on a light
    tab strip and paper on a dark one; the product's own ground and ink.
  -->
  <style>
    path { fill: #100e0b; }
    @media (prefers-color-scheme: dark) {
      path { fill: #eeede9; }
    }
  </style>
  <path
    fill-rule="evenodd"
    clip-rule="evenodd"
    d="M12 1.5 21.5 5.6V12c0 5.2-3.8 9.3-9.5 10.5C6.3 21.3 2.5 17.2 2.5 12V5.6L12 1.5Z M6.6 6.8h10.8v2.4H6.6Z M7.8 10.8h8.4v2.4H7.8Z M9 14.8h6v2.4H9Z"
  />
</svg>
