ze="9.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#6B665C">nomic-embed-text</text><path d="M730 224 L770 224" stroke="#9A958A" stroke-width="1.4" marker-end="url(#a)"/><rect x="778" y="132" width="200" height="100" rx="6" fill="#F0FAF3" stroke="#16A34A" stroke-width="1.4"/><text x="878.0" y="179.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#14130F">Knowledge store</text><text x="878.0" y="195.0" text-anchor="middle" font-size="9.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#6B665C">SQLite + vectors</text><path d="M878 236 L878 264" stroke="#9A958A" stroke-width="1.4" marker-end="url(#a)"/><rect x="778" y="268" width="200" height="74" rx="6" fill="#F0FAF3" stroke="#16A34A" stroke-width="1.4"/><text x="878.0" y="302.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#14130F">Evidence units</text><text x="878.0" y="318.0" text-anchor="middle" font-size="9.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#6B665C">cosine · BM25 fallback</text><path d="M982 236 L1022 236" stroke="#9A958A" stroke-width="1.4" marker-end="url(#a)"/><rect x="1000" y="120" width="160" height="200" rx="6" fill="#FFFFFF" stroke="#B98A2E" stroke-width="1.4"/><text x="1080" y="146" text-anchor="middle" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" letter-spacing="1.6" fill="#B98A2E">PROVENANCE</text><text x="1018" y="174" font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#6B665C">· source document</text><text x="1018" y="198" font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#6B665C">· page / section</text><text x="1018" y="222" font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#6B665C">· region on page</text><text x="1018" y="246" font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#6B665C">· ingested at</text><text x="1018" y="270" font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#6B665C">· version</text><text x="1018" y="294" font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#6B665C">· classification</text><rect x="40" y="372" width="1120" height="38" rx="6" fill="#16A34A" fill-opacity="0.08" stroke="#16A34A" stroke-width="1"/><text x="60" y="396" font-size="13" font-weight="700" fill="#16A34A">RAW DOCUMENT → TRACEABLE EVIDENCE</text><text x="1140" y="396" text-anchor="end" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#6B665C">every extracted fact keeps its origin</text></g></svg>