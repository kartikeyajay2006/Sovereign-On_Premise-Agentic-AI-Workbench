"#FDF6EE" stroke="#C2620C" stroke-width="2"/><text x="473" y="150" text-anchor="middle" font-size="13.5" font-weight="800" letter-spacing="2" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#C2620C">ISOLATED SUBPROCESS</text><text x="473" y="172" text-anchor="middle" font-size="10.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#6B665C">python · scrubbed env · scoped cwd</text><rect x="328" y="190" width="290" height="26" rx="4" fill="#FFFFFF" stroke="#DC2626" stroke-width="1" stroke-opacity=".5"/><text x="340" y="207" font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" fill="#DC2626">✗  NETWORK</text><text x="606" y="207" text-anchor="end" font-size="9.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#6B665C">socket primitives neutralised</text><rect x="328" y="222" width="290" height="26" rx="4" fill="#FFFFFF" stroke="#16A34A" stroke-width="1" stroke-opacity=".5"/><text x="340" y="239" font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" fill="#16A34A">✓  FILES</text><text x="606" y="239" text-anchor="end" font-size="9.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#6B665C">scoped workspace</text><rect x="328" y="254" width="290" height="26" rx="4" fill="#FFFFFF" stroke="#16A34A" stroke-width="1" stroke-opacity=".5"/><text x="340" y="271" font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" fill="#16A34A">✓  CPU</text><text x="606" y="271" text-anchor="end" font-size="9.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#6B665C">RLIMIT_CPU</text><rect x="328" y="286" width="290" height="26" rx="4" fill="#FFFFFF" stroke="#16A34A" stroke-width="1" stroke-opacity=".5"/><text x="340" y="303" font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" fill="#16A34A">✓  MEMORY</text><text x="606" y="303" text-anchor="end" font-size="9.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#6B665C">RLIMIT_AS</text><rect x="328" y="318" width="290" height="26" rx="4" fill="#FFFFFF" stroke="#16A34A" stroke-width="1" stroke-opacity=".5"/><text x="340" y="335" font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" fill="#16A34A">✓  PROCESSES</text><text x="606" y="335" text-anchor="end" font-size="9.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#6B665C">RLIMIT_NPROC</text><path d="M642 236 L684 236" stroke="#9A958A" stroke-width="1.4" marker-end="url(#a)"/><rect x="692" y="206" width="200" height="60" rx="6" fill="#FFFFFF" stroke="#C2620C" stroke-width="1.4"/><text x="792.0" y="233.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#14130F">Execution result</text><text x="792.0" y="249.0" text-anchor="middle" font-size="9.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#6B665C">stdout · artefacts</text><rect x="692" y="292" width="468" height="106" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.3"/><text x="712" y="316" font-size="10.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" letter-spacing="1.6" fill="#DC2626">RUNTIME DENIAL — RECORDED TO THE AUDIT TRAIL</text><text x="712" y="342" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#14130F">socket.connect(('8.8.8.8', 53))</text><text x="712" y="364" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#DC2626">→ RuntimeError: network access is disabled</text><text x="712" y="386" font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#6B665C">the shim replaces socket primitives before user code imports them</text><rect x="916" y="206" width="244" height="60" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/><text x="1038.0" y="233.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#14130F">Verification input</text><text x="1038.0" y="249.0" text-anchor="middle" font-size="9.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#6B665C">figures recomputed</text><rect x="40" y="412" width="1120" height="38" rx="6" fill="#C2620C" fill-opacity="0.08" stroke="#C2620C" stroke-width="1"/><text x="60" y="436" font-size="13" font-weight="700" fill="#C2620C">CODE RUNS. NETWORK DOESN'T.</text><text x="1140" y="436" text-anchor="end" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#6B665C">application-level isolation — not a VM or container</text></g></svg>