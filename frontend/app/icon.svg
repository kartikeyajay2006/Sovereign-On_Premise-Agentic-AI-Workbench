<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32">
  <!--
    The AEGIS mark at tab size: the ink tile with the glyph, as in
    components/aegis-logo.tsx. The colours follow the browser's theme, so
    the tile is ink on a light tab strip and ivory on a dark one.
  -->
  <style>
    .tile { fill: #141413; }
    .ink { stroke: #faf9f6; fill: none; }
    .dot { fill: #faf9f6; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #f2f1ec; }
      .ink { stroke: #141413; }
      .dot { fill: #141413; }
    }
  </style>
  <rect class="tile" x="0.5" y="0.5" width="23" height="23" rx="6.5" />
  <path class="ink" d="M6.6 17.4 12 6.6l5.4 10.8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
  <circle class="dot" cx="12" cy="15.1" r="1.55" />
</svg>
