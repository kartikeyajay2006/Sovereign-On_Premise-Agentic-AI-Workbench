<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Typical local AI compared with the AEGIS pipeline"><rect width="1200" height="400" fill="#F7F5F0"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9A958A"/></marker></defs><g font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><text x="40" y="46" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" letter-spacing="2.4" fill="#6B665C">TYPICAL LOCAL AI</text><rect x="40" y="76" width="240" height="44" rx="6" fill="#FFFFFF" stroke="#9A958A" stroke-width="1.4"/><text x="160.0" y="102.0" text-anchor="middle" font-size="12" font-weight="700" fill="#14130F">User</text><path d="M160 120 L160 138" stroke="#9A958A" stroke-width="1.4" marker-end="url(#a)"/><rect x="40" y="138" width="240" height="44" rx="6" fill="#FFFFFF" stroke="#9A958A" stroke-width="1.4"/><text x="160.0" y="164.0" text-anchor="middle" font-size="12" font-weight="700" fill="#14130F">Local LLM</text><path d="M160 182 L160 200" stroke="#9A958A" stroke-width="1.4" marker-end="url(#a)"/><rect x="40" y="200" width="240" height="44" rx="6" fill="#FFFFFF" stroke="#9A958A" stroke-width="1.4"/><text x="160.0" y="226.0" text-anchor="middle" font-size="12" font-weight="700" fill="#14130F">Answer</text><text x="40" y="290" font-size="11.5" fill="#6B665C">One hop. Nothing recorded, nothing checked,</text><text x="40" y="308" font-size="11.5" fill="#6B665C">nothing you could show an auditor afterwards.</text><path d="M330 40 L330 360" stroke="#DCD8CE" stroke-width="1.5"/><text x="380" y="46" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" letter-spacing="2.4" fill="#16A34A">AEGIS</text><rect x="380" y="76" width="176" height="46" rx="6" fill="#FFFFFF" stroke="#14130F" stroke-width="1.4"/><text x="468.0" y="103.0" text-anchor="middle" font-size="12" font-weight="700" fill="#14130F">Private data</text><path d="M556 99 L578 99" stroke="#9A958A" stroke-width="1.4" marker-end="url(#a)"/><rect x="580" y="76" width="176" height="46" rx="6" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.4"/><text x="668.0" y="103.0" text-anchor="middle" font-size="12" font-weight="700" fill="#14130F">Traceable evidence</text><path d="M756 99 L778 99" stroke="#9A958A" stroke-width="1.4" marker-end="url(#a)"/><rect x="780" y="76" width="176" height="46" rx="6" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.4"/><text x="868.0" y="103.0" text-anchor="middle" font-size="12" font-weight="700" fill="#14130F">Governed routing</text><path d="M956 99 L978 99" stroke="#9A958A" stroke-width="1.4" marker-end="url(#a)"/><rect x="980" y="76" width="176" height="46" rx="6" fill="#FFFFFF" stroke="#C2620C" stroke-width="1.4"/><text x="1068.0" y="103.0" text-anchor="middle" font-size="12" font-weight="700" fill="#14130F">Constrained execution</text><rect x="380" y="180" width="176" height="46" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/><text x="468.0" y="207.0" text-anchor="middle" font-size="12" font-weight="700" fill="#14130F">Verification</text><path d="M556 203 L578 203" stroke="#9A958A" stroke-width="1.4" marker-end="url(#a)"/><rect x="580" y="180" width="176" height="46" rx="6" fill="#FFFFFF" stroke="#B98A2E" stroke-width="1.4"/><text x="668.0" y="207.0" text-anchor="middle" font-size="12" font-weight="700" fill="#14130F">Policy + human control</text><path d="M756 203 L778 203" stroke="#9A958A" stroke-width="1.4" marker-end="url(#a)"/><rect x="780" y="180" width="176" height="46" rx="6" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.4"/><text x="868.0" y="207.0" text-anchor="middle" font-size="12" font-weight="700" fill="#14130F">Provable output</text><path d="M468 122 L468 158 L1136 158" stroke="#9A958A" stroke-width="1.4" fill="none" stroke-dasharray="3 3"/><text x="380" y="290" font-size="11.5" fill="#6B665C">Each stage constrains the next, and each leaves a record. The answer arrives with its</text><text x="380" y="308" font-size="11.5" fill="#6B665C">sources, its recomputed figures, the policy decisions it passed, and who released it.</text><rect x="40" y="340" width="1120" height="38" rx="6" fill="#16A34A" fill-opacity=".08" stroke="#16A34A" stroke-width="1"/><text x="60" y="364" font-size="13" font-weight="700" fill="#16A34A">RUNNING A MODEL LOCALLY SOLVES ONE PART OF THE PROBLEM.</text><text x="1140" y="364" text-anchor="end" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#6B665C">AEGIS governs the rest of the lifecycle</text></g></svg>